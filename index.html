  <style id="splash-screen-style">
    /* Ahead's start: Buddy's orb glowing, the name under it. Night (dark)
       or Glow (light), like the app. Gone as soon as Flutter draws. */
    @font-face{font-family:"Bricolage";font-weight:600;font-display:swap;
      src:url("assets/assets/fonts/BricolageGrotesque-SemiBold.ttf") format("truetype")}
    html{height:100%}
    body{margin:0;min-height:100%;background:#0C0A09}
    #splash{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden;
      background:radial-gradient(70% 55% at 50% 42%,rgba(217,129,63,.30),rgba(12,10,9,0) 70%),#0C0A09;
      color:#F5EFEA;font-family:"Bricolage",ui-sans-serif,system-ui,sans-serif;transition:opacity .35s ease}
    #splash.gone{opacity:0}
    #splash .mark{display:flex;flex-direction:column;align-items:center;gap:22px;transform:translateY(-4vh)}
    #splash .orb{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;
      background:radial-gradient(circle at 34% 28%,#FFEBD9 0%,#F4B98A 27%,#C8682F 63%,#7A3A16 100%);
      box-shadow:0 0 50px rgba(217,129,63,.6),0 0 120px rgba(217,129,63,.3);animation:breathe 2.6s ease-in-out infinite alternate}
    #splash .orb svg{width:100%;height:100%}
    #splash .name{font-size:44px;font-weight:600;letter-spacing:-.04em;line-height:1}
    #splash .tag{margin-top:-10px;font:500 15px/1.3 ui-sans-serif,system-ui,-apple-system,sans-serif;color:#A79C93}
    #splash .bar{position:absolute;bottom:calc(64px + env(safe-area-inset-bottom));left:50%;width:120px;height:3px;margin-left:-60px;
      border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
    #splash .bar i{position:absolute;inset:0;width:40%;border-radius:3px;background:linear-gradient(90deg,#F4B98A,#B06030);animation:run 1.2s ease-in-out infinite}
    @keyframes breathe{from{transform:scale(.97);box-shadow:0 0 36px rgba(217,129,63,.45),0 0 90px rgba(217,129,63,.2)}to{transform:scale(1.03)}}
    @keyframes run{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
    @media (prefers-color-scheme:light){
      body{background:#FBF7F3}
      #splash{background:radial-gradient(70% 55% at 50% 40%,rgba(244,183,138,.55),rgba(251,247,243,0) 70%),#FBF7F3;color:#17120E}
      #splash .orb{box-shadow:0 22px 50px rgba(176,96,48,.35)}
      #splash .tag{color:#6B625B}
      #splash .bar{background:rgba(23,18,14,.08)}
    }
    @media (prefers-reduced-motion:reduce){#splash .orb,#splash .bar i{animation:none}}
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      const el = document.getElementById("splash");
      if (!el) return;
      el.classList.add("gone");
      setTimeout(() => el.remove(), 380);
      document.body.style.background = "transparent";
    }
    // Flutter tells the page when its first frame is on screen
    window.addEventListener("flutter-first-frame", removeSplashFromWeb);
  </script>

    </div>
    <div class="bar"><i></i></div>
  </div>
  
  
  
  
  
  <script>
    // Older builds installed Flutter's offline cache, which kept serving the
    // old app on reload. Remove only that one (the reminder worker stays),
    // then load the current version from the server.
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations().then(rs => {
        const old = rs.filter(r => [r.active, r.waiting, r.installing]
          .some(w => w && w.scriptURL.includes("flutter_service_worker.js")));
        if (!old.length) return;
        Promise.all([
          ...old.map(r => r.unregister()),
          window.caches ? caches.keys().then(ks => Promise.all(
            ks.filter(k => k.startsWith("flutter-")).map(k => caches.delete(k)))) : null,
        ]).then(() => location.reload());
      });
    }
  </script>
