name: budget_buddy
description: Ahead — your buddy for money and the future
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # German texts in the built-in dialogs (date picker, tooltips, OK/Abbrechen)
  flutter_localizations:
    sdk: flutter

  # Date formatting (German format)
  intl: ^0.20.2

  # Local NoSQL database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UUID generation (transaction IDs)
  uuid: ^4.0.0

  # File picker for CSV import
  file_picker: ^10.3.8

  # Biometric / device-credential app lock
  local_auth: ^2.3.0

  # Sharing exported CSV / backup files
  share_plus: ^10.1.4

  # Locating a temp directory to write export files
  path_provider: ^2.1.5

  # HTTP client for live market prices
  http: ^1.2.2

  # opening the bank consent link in the browser
  url_launcher: ^6.3.0
  flutter_secure_storage: ^10.3.4
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  web: ^1.1.1
  in_app_purchase: ^3.3.1
  in_app_purchase_android: ^0.5.0
  cryptography: ^2.7.0
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # generate app launcher icons + native splash from a single source image
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/Inter-OFL.txt
    - assets/fonts/BricolageGrotesque-OFL.txt

  # Inter for body, Bricolage for headlines (both SIL OFL)
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
    # headlines, the same face as on the landing page (SIL OFL)
    - family: Bricolage
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Light.ttf
          weight: 300
        - asset: assets/fonts/BricolageGrotesque-Regular.ttf
          weight: 400
        - asset: assets/fonts/BricolageGrotesque-Medium.ttf
          weight: 500
        - asset: assets/fonts/BricolageGrotesque-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BricolageGrotesque-Bold.ttf
          weight: 700
        - asset: assets/fonts/BricolageGrotesque-ExtraBold.ttf
          weight: 800

# app icon generation (run: dart run flutter_launcher_icons)
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    background_color: "#0C0A09"
    theme_color: "#B06030"
  macos:
    generate: true
    image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#1A0D07"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"

# native splash screen (run: dart run flutter_native_splash:create)
flutter_native_splash:
  color: "#FBF7F3"
  image: "assets/icon/splash.png"
  color_dark: "#0C0A09"
  image_dark: "assets/icon/splash_dark.png"
  # the web start screen is hand-made in web/index.html
  web: false
  android_12:
    color: "#FBF7F3"
    image: "assets/icon/splash_android12.png"
    color_dark: "#0C0A09"
    image_dark: "assets/icon/splash_android12_dark.png"
